[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceg-reproduce"
version = "0.1.0"
description = "CEG claim-level counterfactual verification experiments for LVLM hallucination mitigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ceg_reproduce contributors" }]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
models = [
    "accelerate>=0.27.0",
    "sentencepiece>=0.1.99",
    "torch>=2.1.0",
    "transformers>=4.36.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
